name: Gauntlet Windows build (ARCHIVED — manual only)

# ARCHIVED. The Gauntlet roguelite is no longer the focus of this repo — DofusSlice is the
# go-forward game (see Gauntlet/ARCHIVED.md and HANDOVER.md). This workflow is kept so the
# Gauntlet can still be built on demand, but it NO LONGER runs automatically on push and no
# longer republishes the `gauntlet-latest` release on every engine change. The last release
# it built stays live. To build a fresh Gauntlet package, trigger this workflow by hand from
# the Actions tab (Run workflow).
#
# Builds a self-contained Windows package of THE GAUNTLET OF THE BELL:
#  - as a workflow artifact (needs a GitHub login to download), and
#  - as a GitHub *Release* asset (public, permanent link, no login, works on mobile).
# Unzip and double-click Gauntlet.exe — no .NET install required. The 1-bit art packs
# are local-only (never committed), so the CI build runs on the built-in fallbacks.

on:
  workflow_dispatch:   # manual only — archived; the push trigger was removed (see the note above)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained win-x64
        run: >
          dotnet publish Gauntlet/Gauntlet.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o publish

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Gauntlet-windows.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gauntlet-windows
          path: publish

      - name: Publish GitHub Release (public download, no login)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gauntlet-latest --yes --cleanup-tag 2>$null
          gh release create gauntlet-latest Gauntlet-windows.zip `
            --title "THE GAUNTLET OF THE BELL - latest build" `
            --notes "Self-contained Windows build. Download Gauntlet-windows.zip, unzip it, and run Gauntlet.exe. No .NET install needed." `
            --prerelease `
            --target $env:GITHUB_SHA
